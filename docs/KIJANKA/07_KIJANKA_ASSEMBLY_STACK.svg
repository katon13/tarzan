<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<style>
    .title { font-family: Arial, sans-serif; font-size: 28px; fill: #111; font-weight: bold; }
    .sub   { font-family: Arial, sans-serif; font-size: 18px; fill: #111; }
    .txt   { font-family: Arial, sans-serif; font-size: 16px; fill: #111; }
    .small { font-family: Arial, sans-serif; font-size: 13px; fill: #111; }
    .tiny  { font-family: Arial, sans-serif; font-size: 11px; fill: #111; }
    .line  { stroke: #111; stroke-width: 2.5; fill: none; }
    .thin  { stroke: #333; stroke-width: 1.4; fill: none; }
    .dash  { stroke: #666; stroke-width: 1.4; fill: none; stroke-dasharray: 10 6; }
    .ghost { stroke: #888; stroke-width: 1.0; fill: none; stroke-dasharray: 4 4; }
    .part  { stroke: #111; stroke-width: 2.2; fill: #f3f3f3; }
    .fill1 { stroke: #111; stroke-width: 2.2; fill: #e0e0e0; }
    .fill2 { stroke: #111; stroke-width: 2.2; fill: #d2d2d2; }
    .accent{ stroke: #111; stroke-width: 2.2; fill: #c7c7c7; }
</style>
<rect x="0" y="0" width="1600" height="1100" fill="white"/>
<rect x="20" y="20" width="1560" height="1060" class="line"/>

<text x="40" y="60" class="title">KIJANKA — Assembly Stack / Exploded Concept</text>
<rect x="420" y="730" width="680" height="80" class="part"/>
<text x="640" y="778" class="txt">1. Base plate Al 20 mm</text>
