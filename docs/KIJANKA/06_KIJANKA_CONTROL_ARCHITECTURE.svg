<rect x="70" y="770" width="1420" height="97" class="ghost"/>
<text x="80" y="790" class="small">Architecture principle:</text>
<text x="80" y="808" class="small">L1 local servo loop -> L2 base compensation -> L3 scene/choreography logic.</text>
<text x="80" y="826" class="small">Brakes are fail-safe and commanded as safety objects, not regular motion actuators.</text>
<text x="80" y="844" class="small">Travel axis is independent from wheel compensation but coordinated centrally.</text>
<rect x="960" y="960" width="620" height="110" class="line"/>
<line x1="1110" y1="960" x2="1110" y2="1070" class="thin"/>
<line x1="1260" y1="960" x2="1260" y2="1070" class="thin"/>
