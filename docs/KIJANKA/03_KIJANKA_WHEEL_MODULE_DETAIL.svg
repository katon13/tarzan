<text x="75" y="183" class="small">  - No worm gear in v2</text>
<text x="75" y="201" class="small">  - Holding by brake, not by self-locking screw</text>
<text x="75" y="219" class="small">  - Screw pushes only, does not guide</text>
<text x="75" y="237" class="small">  - P0 and P2 are critical geometry points</text>
