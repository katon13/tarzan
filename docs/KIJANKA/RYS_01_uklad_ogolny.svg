<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<style>
.txt{font-family:Arial,sans-serif;font-size:22px;fill:#111}
.small{font-family:Arial,sans-serif;font-size:16px;fill:#111}
.line{stroke:#111;stroke-width:3;fill:none}
.dash{stroke:#666;stroke-width:2;fill:none;stroke-dasharray:10 8}
.part{stroke:#111;stroke-width:3;fill:#e9e9e9}
.accent{stroke:#111;stroke-width:3;fill:#d8d8d8}
</style>
<rect width="100%" height="100%" fill="white"/>

<text x="60" y="60" class="txt">KIJANKA — rysunek poglądowy układu ogólnego</text>
<rect x="250" y="150" width="900" height="600" rx="80" class="part"/>
<circle cx="350" cy="250" r="70" class="accent"/>
<circle cx="1050" cy="250" r="70" class="accent"/>
<circle cx="350" cy="650" r="70" class="accent"/>
<circle cx="1050" cy="650" r="70" class="accent"/>
<text x="300" y="255" class="small">Koło S1</text>
<text x="1000" y="255" class="small">Koło S2</text>
<text x="300" y="655" class="small">Koło S3</text>
<text x="1000" y="655" class="small">Koło S4</text>
<rect x="520" y="350" width="360" height="200" class="accent"/>
<text x="580" y="455" class="txt">Strefa centralna S5</text>
<line x1="700" y1="60" x2="700" y2="920" class="dash"/>
<line x1="120" y1="450" x2="1280" y2="450" class="dash"/>
<text x="715" y="110" class="small">oś symetrii Y</text>
<text x="1180" y="440" class="small">oś symetrii X</text>
<text x="180" y="170" class="small">Baza dolna 20 mm Al</text>
</svg>