<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>TARZAN TFD OVERLAY</title>
    <link rel="stylesheet" href="tarzan_tfd_overlay.css?v=20260515-v14-axis-value-bg">
</head>
<body class="font-text">
    <div id="tfd-container">
        <!-- TOP PANEL -->
        <div class="panel top-panel font-text">
            <div class="item status-item">
                <span id="t_status" class="value font-text text-value">LIVE</span>
            </div>
            <div class="item tc-live-item">
                <span class="label font-text">TC</span>
                <span id="t0" class="value font-digital digital-value main-tc-value">00:00:00:000</span>
            </div>
            <div class="item take-item">
                <span class="label font-text">TAKE</span>
                <span id="t_take" class="value font-digital digital-value">001</span>
            </div>
        </div>

        <!-- LEFT PANEL (CAM AXES) -->
        <div class="panel side-panel left-panel">
            <div class="axis-group">
                <div class="axis-item">
                    <img src="/img/axes/ta_os_pozioma_kamery_ico_128_active.png" class="axis-icon" alt="oś pozioma kamery">
                    <span id="t_axis0" class="axis-value value font-digital digital-value">00000</span>
                </div>
                <div class="axis-item">
                    <img src="/img/axes/ta_os_pionowa_kamery_ico_128_active.png" class="axis-icon" alt="oś pionowa kamery">
                    <span id="t_axis1" class="axis-value value font-digital digital-value">00000</span>
                </div>
                <div class="axis-item">
                    <img src="/img/axes/ta_os_pochylu_kamery_ico_128_active.png" class="axis-icon" alt="oś pochyłu kamery">
                    <span id="t_axis2" class="axis-value value font-digital digital-value">00000</span>
                </div>
                <div class="axis-item">
                    <img src="/img/axes/ta_os_ostrosci_kamery_ico_128_active.png" class="axis-icon" alt="oś ostrości kamery">
                    <span id="t_axis3" class="axis-value value font-digital digital-value">00000</span>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL (ARM AXES + SENSORS) -->
        <div class="panel side-panel right-panel">
            <div class="axis-group">
                <div class="axis-item">
                    <img src="/img/axes/ta_os_pionowa_ramienia_ico_128_active.png" class="axis-icon" alt="oś pionowa ramienia">
                    <span id="t_axis4" class="axis-value value font-digital digital-value">00000</span>
                </div>
                <div class="axis-item">
                    <img src="/img/axes/ta_os_pozioma_ramienia_ico_128_active.png" class="axis-icon" alt="oś pozioma ramienia">
                    <span id="t_axis5" class="axis-value value font-digital digital-value">00000</span>
                </div>
            </div>

            <div class="sensor-group">
                <div class="sensor-item">
                    <img src="/img/nextion/page/tfd_laser.png" class="sensor-icon" alt="laser">
                    <span id="t_laser" class="sensor-value value font-text text-value">OK</span>
                </div>
                <div class="sensor-item">
                    <img src="/img/nextion/page/tfd_limit.png" class="sensor-icon" alt="limits">
                    <span id="t_limits" class="sensor-value value font-text text-value">OK</span>
                </div>
                <div class="sensor-item">
                    <img src="/img/nextion/page/tfd_shock.png" class="sensor-icon" alt="shock">
                    <span id="t_shock" class="sensor-value value font-text text-value">OFF</span>
                </div>
                <div class="sensor-item">
                    <img src="/img/nextion/page/tfd_litht.png" class="sensor-icon" alt="light">
                    <span id="t_light" class="sensor-value value font-digital digital-value">00000</span>
                </div>
                <div class="sensor-item">
                    <img src="/img/nextion/page/tfd_temp.png" class="sensor-icon" alt="temp">
                    <span id="t_temp" class="sensor-value value font-digital digital-value">22C</span>
                </div>
                <div class="sensor-item">
                    <img src="/img/nextion/page/tfd_xyz.png" class="sensor-icon" alt="xyz">
                    <span id="t_xyz" class="sensor-value value font-digital digital-value">+0 +0 +0</span>
                </div>
            </div>
        </div>

        <!-- BOTTOM PANEL -->
        <div class="panel bottom-panel font-text">
            <div class="meta-group">
                <div class="item">
                    <span class="label font-text">TITLE:</span>
                    <span id="t1" class="value font-text text-value">TYTUŁ FILMU</span>
                </div>
                <div class="item">
                    <span class="label font-text">DIRECTOR:</span>
                    <span id="t2" class="value font-text text-value">REŻYSER</span>
                </div>
            </div>
            <div id="clap-indicator" class="clap-off font-text text-value">CLAP</div>
        </div>
    </div>

    <script src="tarzan_tfd_overlay.js?v=20260515-v14-axis-value-bg"></script>
</body>
</html>
