<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<style>
.txt{font-family:Arial,sans-serif;font-size:22px;fill:#111}
.small{font-family:Arial,sans-serif;font-size:16px;fill:#111}
.line{stroke:#111;stroke-width:3;fill:none}
.dash{stroke:#666;stroke-width:2;fill:none;stroke-dasharray:10 8}
.part{stroke:#111;stroke-width:3;fill:#e9e9e9}
.accent{stroke:#111;stroke-width:3;fill:#d8d8d8}
</style>
<rect width="100%" height="100%" fill="white"/>

<text x="60" y="60" class="txt">KIJANKA — napęd przejazdu po pasie referencyjnym</text>
<line x1="160" y1="520" x2="1240" y2="520" class="line"/>
<text x="520" y="500" class="small">Pas referencyjny mocowany do podłoża ~10 m</text>
<rect x="480" y="300" width="440" height="180" rx="40" class="part"/>
<text x="610" y="395" class="txt">Wózek KIJANKA</text>
<rect x="860" y="240" width="120" height="50" class="part"/>
<text x="870" y="272" class="small">Napęd jazdy</text>
<line x1="920" y1="290" x2="920" y2="520" class="line"/>
<circle cx="920" cy="520" r="24" class="accent"/>
<text x="945" y="525" class="small">Koło napędowe</text>
<text x="80" y="545" class="small">Mocowanie A</text>
<text x="1240" y="545" class="small">Mocowanie B</text>
</svg>