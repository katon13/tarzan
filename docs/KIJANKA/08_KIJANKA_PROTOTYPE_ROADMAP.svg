<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<style>
    .title { font-family: Arial, sans-serif; font-size: 28px; fill: #111; font-weight: bold; }
    .sub   { font-family: Arial, sans-serif; font-size: 18px; fill: #111; }
    .txt   { font-family: Arial, sans-serif; font-size: 16px; fill: #111; }
    .small { font-family: Arial, sans-serif; font-size: 13px; fill: #111; }
    .tiny  { font-family: Arial, sans-serif; font-size: 11px; fill: #111; }
    .line  { stroke: #111; stroke-width: 2.5; fill: none; }
    .thin  { stroke: #333; stroke-width: 1.4; fill: none; }
    .dash  { stroke: #666; stroke-width: 1.4; fill: none; stroke-dasharray: 10 6; }
    .ghost { stroke: #888; stroke-width: 1.0; fill: none; stroke-dasharray: 4 4; }
    .part  { stroke: #111; stroke-width: 2.2; fill: #f3f3f3; }
    .fill1 { stroke: #111; stroke-width: 2.2; fill: #e0e0e0; }
    .fill2 { stroke: #111; stroke-width: 2.2; fill: #d2d2d2; }
    .accent{ stroke: #111; stroke-width: 2.2; fill: #c7c7c7; }
</style>
<rect x="0" y="0" width="1600" height="1100" fill="white"/>
<rect x="20" y="20" width="1560" height="1060" class="line"/>

<text x="40" y="60" class="title">KIJANKA — Prototype Roadmap</text>
<rect x="120" y="180" width="280" height="120" class="part"/>
<text x="135" y="205" class="small">STEP 1</text>
<text x="135" y="238" class="txt">Freeze base geometry</text>
<text x="135" y="268" class="small">Plate, axes, mounting zones</text>
<rect x="470" y="180" width="280" height="120" class="part"/>
<text x="485" y="205" class="small">STEP 2</text>
<text x="485" y="238" class="txt">Build 1 wheel module</text>
<text x="485" y="268" class="small">Verify P0/P2, brake, stroke</text>
<rect x="820" y="180" width="280" height="120" class="part"/>
<text x="835" y="205" class="small">STEP 3</text>
<text x="835" y="238" class="txt">Bench test module</text>
<text x="835" y="268" class="small">Load, fail-safe, dynamics</text>
<rect x="1170" y="180" width="280" height="120" class="part"/>
<text x="1185" y="205" class="small">STEP 4</text>
<text x="1185" y="238" class="txt">Build belt travel axis</text>
<text x="1185" y="268" class="small">10 m reference setup</text>
<rect x="295" y="430" width="280" height="120" class="part"/>
<text x="310" y="455" class="small">STEP 5</text>
<text x="310" y="488" class="txt">Integrate frame + 2 modules</text>
<text x="310" y="518" class="small">Partial dynamic tests</text>
<rect x="645" y="430" width="280" height="120" class="part"/>
<text x="660" y="455" class="small">STEP 6</text>
<text x="660" y="488" class="txt">Build full 4-wheel prototype</text>
<text x="660" y="518" class="small">Complete mechanics</text>
<rect x="995" y="430" width="280" height="120" class="part"/>
<text x="1010" y="455" class="small">STEP 7</text>
<text x="1010" y="488" class="txt">Integrate TARZAN / EHR / TAKE</text>
<text x="1010" y="518" class="small">Choreography & repeatability</text>
<line x1="400" y1="240" x2="470" y2="240" class="line"/>
<line x1="750" y1="240" x2="820" y2="240" class="line"/>
<line x1="1100" y1="240" x2="1170" y2="240" class="line"/>
<line x1="1310" y1="300" x2="1310" y2="390" class="line"/>
<line x1="1310" y1="490" x2="1275" y2="490" class="line"/>
<line x1="995" y1="490" x2="925" y2="490" class="line"/>
<line x1="645" y1="490" x2="575" y2="490" class="line"/>
<rect x="90" y="770" width="1420" height="97" class="ghost"/>
<text x="100" y="790" class="small">Execution philosophy:</text>
<text x="100" y="808" class="small">Design from the highest-risk mechanics first.</text>
<text x="100" y="826" class="small">Do not build all 4 corners before proving one module.</text>
<text x="100" y="844" class="small">Travel axis and compensation should be validated separately, then integrated.</text>
<rect x="960" y="960" width="620" height="110" class="line"/>
<line x1="1110" y1="960" x2="1110" y2="1070" class="thin"/>
<line x1="1260" y1="960" x2="1260" y2="1070" class="thin"/>
<line x1="1410" y1="960" x2="1410" y2="1070" class="thin"/>
<line x1="1510" y1="960" x2="1510" y2="1070" class="thin"/>
<line x1="960" y1="995" x2="1580" y2="995" class="thin"/>
<line x1="960" y1="1030" x2="1580" y2="1030" class="thin"/>
<text x="975" y="986" class="small">PROJECT</text>
<text x="975" y="1019" class="txt">KIJANKA</text>
<text x="975" y="1055" class="small">DRAWING</text>
<text x="975" y="1082" class="txt">PROTOTYPE ROADMAP</text>
<text x="1125" y="986" class="small">DWG NO</text>
<text x="1125" y="1019" class="txt">KJ-PR-008</text>
<text x="1275" y="986" class="small">REV</text>
<text x="1275" y="1019" class="txt">A</text>
<text x="1425" y="986" class="small">SCALE</text>
<text x="1425" y="1019" class="txt">NTS</text>
<text x="1525" y="986" class="small">SHEET</text>
<text x="1525" y="1019" class="txt">1/1</text>
<text x="1125" y="1055" class="small">DATE</text>
<text x="1125" y="1082" class="txt">2026-05-09</text>
<text x="1275" y="1055" class="small">STATUS</text>
<text x="1275" y="1082" class="txt">Concept-Prototyping</text>
<text x="35" y="1075" class="small">Autorska koncepcja techniczna v2 — wymiary główne przyjęte projektowo, do korekty po przeglądzie.</text>
</svg>