<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<style>
.txt{font-family:Arial,sans-serif;font-size:22px;fill:#111}
.small{font-family:Arial,sans-serif;font-size:16px;fill:#111}
.line{stroke:#111;stroke-width:3;fill:none}
.dash{stroke:#666;stroke-width:2;fill:none;stroke-dasharray:10 8}
.part{stroke:#111;stroke-width:3;fill:#e9e9e9}
.accent{stroke:#111;stroke-width:3;fill:#d8d8d8}
</style>
<rect width="100%" height="100%" fill="white"/>

<text x="60" y="60" class="txt">KIJANKA — moduł jednego koła</text>
<circle cx="220" cy="760" r="90" class="part"/>
<text x="170" y="765" class="small">Koło</text>
<circle cx="420" cy="540" r="18" class="accent"/>
<text x="445" y="545" class="small">P0 punkt obrotu</text>
<line x1="420" y1="540" x2="240" y2="710" class="line"/>
<text x="270" y="620" class="small">Ramię / wahacz</text>
<rect x="760" y="330" width="180" height="90" class="part"/>
<text x="785" y="385" class="small">Serwo + hamulec</text>
<rect x="960" y="330" width="120" height="90" class="part"/>
<text x="975" y="385" class="small">Przekładnia</text>
<line x1="1080" y1="375" x2="1240" y2="375" class="line"/>
<rect x="1240" y="345" width="90" height="60" class="part"/>
<text x="1248" y="382" class="small">Śruba</text>
<circle cx="1000" cy="560" r="16" class="accent"/>
<text x="1030" y="565" class="small">P2 punkt pchania</text>
<line x1="1000" y1="560" x2="510" y2="550" class="line"/>
<text x="760" y="520" class="small">Popychacz z przegubem</text>
<line x1="510" y1="550" x2="420" y2="540" class="dash"/>
<text x="760" y="455" class="small">Ruch liniowy ok. 100 mm</text>
</svg>